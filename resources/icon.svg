<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- macOS App Icon Squircle Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426"/>
      <stop offset="50%" stop-color="#18181A"/>
      <stop offset="100%" stop-color="#0E0E10"/>
    </linearGradient>

    <!-- Vibrant macOS System Blue to Indigo Accent Gradient -->
    <linearGradient id="brandAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="60%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#5E5CE6"/>
    </linearGradient>

    <!-- Subtle inner glowing grid/accent for typesetting precision -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Outer Drop Shadow for macOS Big Sur/Sequoia App Icon Standard -->
    <filter id="macAppShadow" x="-20%" y="-20%" width="140%" height="145%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <radialGradient id="highlight" cx="50%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS App Icon Body (Continuous Squircle standard) -->
  <g filter="url(#macAppShadow)">
    <rect x="40" y="40" width="432" height="432" rx="98" fill="url(#bgGrad)" stroke="#38383A" stroke-width="3"/>
    <!-- Subtle Inner Bevel / Rim Light -->
    <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2"/>
    <rect x="40" y="40" width="432" height="432" rx="98" fill="url(#highlight)"/>
  </g>

  <!-- Background Typesetting Alignment / Baseline grid hint (minimal, elegant) -->
  <g opacity="0.16" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6,8">
    <!-- Cap height line -->
    <line x1="90" y1="170" x2="422" y2="170"/>
    <!-- Baseline -->
    <line x1="90" y1="360" x2="422" y2="360"/>
  </g>

  <!-- Core Glyph: Fusion of TeX 'T' & mini 'm' / Greek Tau (τ) in continuous elegant curves -->
  <!-- The primary 'T' bar with serifs & mathematical precision -->
  <g id="brand-glyph">
    <!-- Glowing backdrop bloom behind mark -->
    <ellipse cx="256" cy="270" rx="140" ry="100" fill="#0071E3" opacity="0.15"/>

    <!-- Left stem: 't' stem that fluidly descends and rises into lowercase 'm' arch -->
    <!-- The horizontal crossbar of 'T' (representing TeX structural bar) -->
    <rect x="130" y="156" width="156" height="28" rx="14" fill="url(#brandAccent)"/>
    <!-- TeX mathematical right-bracket serif accent -->
    <circle cx="134" cy="170" r="14" fill="#2997FF"/>

    <!-- Continuous dynamic stroke: T stem flowing into 'm' (two harmonic arches for mini) -->
    <path d="M 184 156
             L 184 324
             C 184 350 206 364 228 348
             C 244 336 254 312 256 290
             C 264 246 294 226 328 226
             C 362 226 382 248 382 284
             L 382 358"
          fill="none"
          stroke="url(#brandAccent)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- The second arch of 'm' denoting 'mini' / double-harmonic wave -->
    <path d="M 256 300
             C 264 252 290 228 326 228
             C 364 228 384 254 384 292
             L 384 358"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="12"
          stroke-linecap="round"
          opacity="0.85"/>

    <!-- Crisp white typography ligature dot / point (the 'i' in mini & precision dot) -->
    <circle cx="384" cy="170" r="16" fill="#FFFFFF"/>
    <!-- Micro companion dot denoting LaTeX compile precision -->
    <circle cx="384" cy="170" r="22" fill="none" stroke="#2997FF" stroke-width="3" opacity="0.6"/>

    <!-- Subtle elegant subline text: 'texmini' in tracked Apple San Francisco style -->
    <text x="256" y="420"
          font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif"
          font-size="28"
          font-weight="700"
          letter-spacing="5"
          fill="#8E8E93"
          text-anchor="middle">
      TEXMINI
    </text>
  </g>
</svg>
